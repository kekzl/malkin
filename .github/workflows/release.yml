name: release

# A published GitHub release builds and pushes ghcr.io/<repo> for linux/amd64 + linux/arm64 (SBOM, provenance,
# keyless cosign signature) and attaches signed binary tarballs per arch. workflow_dispatch builds the ref as :manual.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # gh release upload
  packages: write
  id-token: write  # keyless cosign (Fulcio OIDC)

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || '' }}
      IDENTITY_RE: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(tags|heads)/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: v
        run: |
          set -euo pipefail
          v="${TAG#v}"
          echo "version=${v:-dev}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=raw,value=latest,enable=${{ env.TAG != '' && !github.event.release.prerelease }}
            type=raw,value=manual,enable=${{ env.TAG == '' }}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" --certificate-identity-regexp "$IDENTITY_RE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Binary tarballs
        run: |
          set -euo pipefail
          for p in linux/amd64 linux/arm64; do
            docker buildx build --platform "$p" --target bundle --build-arg VERSION=${{ steps.v.outputs.version }} \
              --cache-from type=gha -o type=local,dest=dist .
          done
          cd dist
          sha256sum -c ./*.tar.gz.sha256
          ls -l

      - name: Sign the tarballs
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity-regexp "$IDENTITY_RE" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done

      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.sigstore.json --clobber
